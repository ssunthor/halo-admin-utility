module_info:
  name: "HALO Admin Utility"
  version: "0.2.9"
  acronym: "HAU"
  category: "Utility"
  description: "Primary operational control plane to provision, govern, and monitor HALO customer tenants."

system_services:
  grpc:
    service_name: "hau-grpc.service"
    service_type: "grpc"
    host: "0.0.0.0"
    port: 50121
    max_workers: 10

logging:
  level: "INFO"
  directory: "/ai/assets/logs/hau_utility"
  enable_file_logging: true
  app_log_filename: "hau.log"
  error_log_filename: "hau_err.log"

paths:
