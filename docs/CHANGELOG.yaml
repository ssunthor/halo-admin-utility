- version: '0.0.8'
  date: '2026-07-30'
  author: 'Martin Kecka'
  changes:
    - category: '✨ New Features & Enhancements'
      items:
        - 'Integrated native GitLab Releases creation into the `GitRelease` and `GitRetry` orchestration pipelines, automatically converting semantic YAML release notes into formatted Markdown.'
        - 'Enhanced `hau git inventory` CLI to visually flag container tags that possess native GitLab documentation with a `[📜 Release Notes]` badge.'
        - 'Updated `hau git audit` CLI to natively track and display the `merge_request_id` associated with every release and retry operation.'
        - 'Added the `--author` override flag to `hau git retry` to ensure parity with the release command and accurate audit attribution.'
        - 'Added `--project` target filtering to `hau git sync-inventory` CLI and underlying gRPC/GraphQL engine for scoped, high-speed inventory updates.'
        - 'Integrated automatic database inventory synchronization as the final step of the `git release` and `git retry` workflows, ensuring instant UI visibility of new releases.'
        - 'Added `--dry-run` execution mode to `hau git release` to safely simulate orchestration logic and LLM changelog generation without mutating GitLab state.'
        - 'Added `hau git delete` CLI command and `GitDelete` gRPC endpoint to safely delete feature branches and container registry tags, complete with pre-deletion inventory safety checks and native audit logging.'
    - category: '🚀 Architecture & Infrastructure'
      items:
        - 'Implemented cursor-based pagination (`afterCursor`) in the GitLab GraphQL inventory fetcher to permanently resolve the 250 node complexity limit crashes.'
        - 'Expanded the Postgres database schema, adding `merge_request_id` to `git_release_audit_log` and `has_native_release` to `git_container`.'
    - category: '🐛 Bug Fixes & Resilience'
      items:
        - 'Implemented an idempotency safety check in `ReleaseOrchestrator` to automatically skip AI changelog generation if a pre-existing higher version is already committed to the source branch, preventing duplicate generation loops.'
        - 'Fixed a `405 Method Not Allowed` race condition by forcing the pipeline manager to actively wait out GitLab MR `checking` and `preparing` validation states before triggering auto-merges.'
        - 'Fixed a mapping bug in `SQLReader` where source feature names were displaying as `Unknown` due to a dictionary key mismatch between `project_name` and `project_path`.'
        - 'Fixed a critical orchestration bug where downstream GitLab API failures (e.g., container retagging, release creation) during `git release` or `git retry` were swallowed, incorrectly marking the audit log as SUCCESS instead of FAILED.'
    - category: '🧹 Refactoring & Chores'
      items:
        - 'Decoupled monolithic `GitlabManager` by extracting Docker V2 registry operations into a dedicated `ContainerRegistryManager`.'
        - 'Decoupled CI/CD pipeline monitoring and Merge Request orchestration into a dedicated `GitPipelineManager`.'
        - 'Refactored `ReleaseOrchestrator` to strictly utilize `SQLReader` and `SQLWriter` for database access, fully removing raw SQLAlchemy logic from the orchestrator layer.'
        - 'Removed orphaned `fetch_container_tags` legacy method, fully deprecating real-time REST API scraping in favor of the `GitInventorySync` database engine.'
        - 'Extracted `fetch_documentation` logic from the gRPC servicer into the `GitlabManager`.'
        - 'Decoupled `SetTenantInternal` database logic from the gRPC layer into `SQLWriter`.'

- version: '0.0.7'
  date: '2026-07-29'
  author: 'Martin Kecka'
  changes:
    - category: '✨ New Features & Enhancements'
      items:
        - 'Implemented the `hau git sync-inventory` CLI command and `GitInventorySync` gRPC endpoint to fetch and bulk-upsert the entire GitLab repository hierarchy (projects, branches, container registries) into a local PostgreSQL database.'
        - 'Implemented the `hau git inventory` CLI command to present a unified topological tree of GitLab resources, seamlessly linking branches with their built container images, mapping `-dev` pre-releases to their source features, and tracking active deployments in real-time.'
        - 'Implemented `GetChangelog` and `GetDocumentation` gRPC endpoints in HAU to dynamically serve markdown documentation and changelogs directly from the central `ai/halo/deployment/docs` repository.'
        - 'Added `--start-commit` optional flag to `hau changelog backfill` (and integrated into `GitBackfillRequest` protobuf) to manually override the starting commit boundary during changelog backfills.'
        - 'Refactored `hau inventory list` topology output to logically group all computational resources by tenant namespace as the primary hierarchy instead of raw cluster locations.'
    - category: '🚀 Architecture & Infrastructure'
      items:
        - 'Engineered a highly-relational SQLAlchemy database schema (`GitProject`, `GitBranch`, `GitContainer`) to persistently cache GitLab structures, enabling sub-millisecond inventory queries and the ability to append metadata like `is_ignored` flags.'
        - 'Engineered `GitlabManager` with a multi-threaded two-pass fetcher that queries GraphQL for Git structures and falls back to concurrent REST calls to resolve author information, exclusively utilized by the `sync-inventory` background engine.'
        - 'Integrated the `GitReleaseAuditLog` Postgres database into the Git Inventory engine to accurately map `-dev` pre-release tags back to their original source features during structure generation.'
        - 'Integrated `TenantResourceInventory` into the Git Inventory engine to dynamically track and display the live active Kubernetes deployment count for every Git container tag in real-time.'
        - 'Updated Postgres database schema (`tenant_resource_inventory`) and `inventory sync` logic to actively track and persist the precise `cluster_name` for every individual resource, allowing hybrid-cloud workloads (e.g. app components in App-Cluster, GPU pipelines in GPU-Cluster) to be accurately sorted under a single unified tenant namespace.'
    - category: '🧹 Refactoring & Chores'
      items:
        - 'Decoupled HAU gRPC controllers (`hau_service.py`) from raw SQLAlchemy models by enforcing a strict Repository pattern via `SQLReader` and `SQLWriter`, consolidating all database access logic into centralized I/O handlers. [NEEDS_DOCS]'
    - category: '🐛 Bug Fixes & Resilience'
      items:
        - 'Fixed an issue in `changelog_orchestrator.py` where backfilling a repository with merged histories (like a monorepo initialization) would incorrectly process the entire historical commit tree instead of isolating the specific day''s commits.'
        - 'Added `-fortinet-pipeline` suffixes to `InventoryOrchestrator` topological inference logic to properly map Fortinet-based Morpheus GPU deployments to their respective namespaces rather than the generic `unmapped-gpu` bucket.'
        - 'Fixed an issue in `git containers` where semantic version tags (releases) were incorrectly flagged as `[⚠️ Branch Deleted]` by verifying against Git tags instead of just active branches.'
        - 'Fixed `git containers` tag-to-branch mapping where container tags with hyphens (`feat-author-test-2`) failed to map to branches with slashes (`feat/author-test-2`), incorrectly flagging them as deleted and displaying the author as `Unknown`.'

- version: '0.0.6'
  date: '2026-07-28'
  author: 'Martin Kecka'
  changes:
    - category: '✨ New Features & Enhancements'
      items:
        - 'Added the `--author` flag to `hau git release` which dynamically maps an input string to the exact GitLab user''s real name (parsing email addresses if necessary) to properly attribute generated changelogs.'
        - 'Implemented the `GitReleaseAuditLog` Postgres database architecture to natively track, lock, and archive the full lifecycle of every `hau git release` and `hau git retry` sequence.'
        - 'Added the `hau git audit` CLI command and corresponding gRPC endpoint to interrogate the release orchestrator''s Postgres database and extract formatted, highly detailed YAML telemetry for any release.'
        - 'Added CLI telemetry to `hau git release` and `hau git retry` to output precise job execution times (pulled natively from the GitLab API) and the final container registry footprint size.'
        - 'Updated the `hau git retry` CLI command and endpoint to natively accept `--merge` arguments, automatically finding and retrying the latest pipeline attached to a given Merge Request.'
        - 'Enhanced release error handling to explicitly output the exact `python3 halo_admin_utility.py git retry --merge <id>` CLI command required to resume the release process if a merge or pipeline fails.'
        - 'Added `--skip-warnings` option to `hau git retry` to allow seamlessly bypassing pipeline retries for jobs that are allowed to fail.'
        - 'Added `source_branch`, `target_branch`, and `error_message` fields to the `GitReleaseAuditLog` database model and `git audit` CLI outputs to deeply track release provenance and failure reasons.'
        - 'Implemented release idempotency checks in `ReleaseOrchestrator` using GitLab''s `repository_compare` API to immediately abort releases if zero new commits exist between branches.'
    - category: '🚀 Architecture & Infrastructure'
      items:
        - 'Replaced static sleep delays during container retagging with an active, deterministic Docker V2 API polling loop to ensure manifests are fully registered before executing tag PUT requests.'
        - 'Implemented strict Git cache sanitization (git reset --hard HEAD and git clean -fd) prior to branch checkouts to guarantee idempotent release operations and prevent dirty-cache pipeline lockups.'
    - category: '🐛 Bug Fixes & Resilience'
      items:
        - 'Fixed a race condition causing double pipeline triggers during release by properly injecting `-o ci.skip` when the orchestrator pushes the auto-generated changelog.'
        - 'Fixed silent API failures during `git retry` on skipped MR pipelines by automatically spawning a fresh MR pipeline when the `.retry()` API call is unsupported.'
        - 'Resolved a race condition when fetching container footprints by dynamically deriving the target tag from the MR source branch instead of relying on unpredictable API timestamp sorting.'
        - 'Injected `[skip ci]` into the merge commit message during manual `git retry` flows to prevent GitLab from spawning duplicate rogue pipelines on the target branch.'
        - 'Fixed a strict orchestration polling bug where MR monitoring would prematurely abort if it intercepted the MR during a temporary `locked` transition state.'
        - 'Corrected misleading pipeline logging where active pipelines finalizing their status were falsely labeled as "Waiting for jobs to start...".'
        - 'Enhanced the `ReleaseOrchestrator` to automatically catch unhandled orchestration exceptions and pipeline failures, persisting the exact error strings into the database lock for CLI troubleshooting.'
        - 'Added a database query pre-check to `hau git release` to warn the operator if the exact source and target branch combination was already successfully released.'
        - 'Fixed a syntax error caused by an unterminated f-string literal in the `git retry` orchestration stream.'

- version: '0.0.5'
  date: '2026-07-27'
  author: 'Martin Kecka'
  changes:
    - category: '✨ New Features & Enhancements'
      items:
        - 'Implemented the complete `hau git release` CLI workflow to automate GitLab project releases natively through the HAU gRPC service.'
        - 'Added the `GitRelease` streaming gRPC endpoint to execute and monitor end-to-end release pipelines, providing real-time CLI feedback.'
        - 'Introduced the `hau git retry` CLI command and `GitRetry` gRPC endpoint to natively trigger retries for failed GitLab pipelines and seamlessly resume their full end-to-end release orchestration.'
        - 'Integrated automated GitLab Merge Request (MR) creation for release operations, bridging feature branches seamlessly into target branches while tracking pipeline status.'
        - 'Integrated the AI-driven `ChangelogOrchestrator` directly into the `GitRelease` pipeline to automatically generate, commit, and push semantic release notes as a seamless step in the release workflow.'
        - 'Enhanced the release orchestrator''s pipeline monitoring to actively stream pipeline job states and automatically dump error traces for failed jobs directly to the CLI, resolving silent timeouts.'
    - category: '🚀 Architecture & Infrastructure'
      items:
        - 'Engineered the release orchestrator with atomic Git operations, automatically invoking `git merge --abort` on conflicts and `git pull --rebase` to seamlessly handle concurrent push race conditions.'
        - 'Optimized CI/CD pipeline efficiency during releases by appending `[skip ci]` to merge commits, preventing redundant branch pipelines while preserving MR security scans.'
        - 'Developed a native Docker registry image retagging mechanism via the Docker V2 API, allowing immediate promotion of feature-branch containers to release versions (e.g. `v0.3.0`) without rebuilding.'
        - 'Implemented robust GitLab API conflict detection, instantly aborting release workflows and returning detailed `405 Method Not Allowed` HTTP errors if MR merge conflicts occur.'
        - 'Scoped all Git identity configurations (`user.name`, `user.email`) strictly to the local repository cache, preventing accidental global host-level mutations.'
    - category: '🐛 Bug Fixes & Resilience'
      items:
        - 'Updated the semantic changelog generator LLM prompt and parsing logic to strictly enforce single quotes for string fields (e.g., `version`, `date`), satisfying strict CI `yamllint` requirements.'
        - 'Implemented a pre-flight safety check in the release command that queries GitLab for active pipelines and aborts the release to prevent inadvertently auto-canceling running feature builds.'

