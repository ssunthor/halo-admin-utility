syntax = "proto3";

package hau;

service HauService {
  rpc GitContainers(GitContainersRequest) returns (GitContainersResponse);
  rpc GitSync(GitSyncRequest) returns (GitSyncResponse);
  rpc GitListCache(GitListCacheRequest) returns (GitListCacheResponse);
  rpc GitPush(GitPushRequest) returns (GitPushResponse);
  rpc GitCheckout(GitCheckoutRequest) returns (GitCheckoutResponse);
  rpc InventorySync(InventorySyncRequest) returns (InventorySyncResponse);
  rpc InventoryList(InventoryListRequest) returns (InventoryListResponse);
  rpc InventoryDeleteOrphaned(InventoryDeleteOrphanedRequest) returns (InventoryDeleteOrphanedResponse);
  rpc GenerateChangelog(GenerateChangelogRequest) returns (GenerateChangelogResponse);
  rpc GitBackfillChangelog(GitBackfillRequest) returns (stream GitBackfillResponse);
  rpc GitRelease(GitReleaseRequest) returns (stream GitReleaseResponse);
  rpc GitRetry(GitRetryRequest) returns (stream GitRetryResponse);
  rpc GitAudit(GitAuditRequest) returns (GitAuditResponse);
  rpc GitInventory(GitInventoryRequest) returns (GitInventoryResponse);
  rpc GetChangelog(GetChangelogRequest) returns (GetChangelogResponse);
  rpc GetDocumentation(GetDocumentationRequest) returns (GetDocumentationResponse);
  rpc GetHaloDocumentationTree(GetHaloDocumentationTreeRequest) returns (GetHaloDocumentationTreeResponse);
  rpc GitInventorySync(GitInventorySyncRequest) returns (GitInventorySyncResponse);
  rpc UpdateTenantCustomization(UpdateTenantCustomizationRequest) returns (UpdateTenantCustomizationResponse);
  rpc GitDelete(GitDeleteRequest) returns (GitDeleteResponse);
  rpc ListFeatures(ListFeaturesRequest) returns (ListFeaturesResponse);
  rpc UpsertFeature(UpsertFeatureRequest) returns (UpsertFeatureResponse);
  rpc NetboxAuditTenant(NetboxAuditTenantRequest) returns (NetboxAuditTenantResponse);
  rpc DeployTenantScaffold(DeployTenantScaffoldRequest) returns (stream DeployTenantScaffoldResponse);
  rpc DecommissionTenant(DecommissionTenantRequest) returns (stream DecommissionTenantResponse);
  rpc GetBaseSchema(GetBaseSchemaRequest) returns (GetBaseSchemaResponse);
}

message InventorySyncRequest {}

message InventorySyncResponse {
  bool success = 1;
  string message = 2;
}

message InventoryListRequest {
  string tenant_slug = 1;
}

message InventoryListResponse {
  bool success = 1;
  string message = 2;
  string result_json = 3;
}

message InventoryDeleteOrphanedRequest {}

message InventoryDeleteOrphanedResponse {
  bool success = 1;
  string message = 2;
}

message UpdateTenantCustomizationRequest {
  string tenant_slug = 1;
  string tenant_category = 2;
  string tenant_tier = 3;
  string update_policy = 4;
  string owner = 5;
  string purpose = 6;
  string maintenance_window = 7;
  string configuration_payload = 8;
}

message UpdateTenantCustomizationResponse {
  bool success = 1;
  string message = 2;
}

message GitContainersRequest {}

message GitContainersResponse {
  bool success = 1;
  string message = 2;
  string result_json = 3;
}

message GitSyncRequest {
  string target = 1;
  string branch = 2;
}

message GitSyncResponse {
  bool success = 1;
  string message = 2;
}

message GitListCacheRequest {}

message GitListCacheResponse {
  bool success = 1;
  string message = 2;
  string result_json = 3;
}

message GitPushRequest {
  string commit_message = 1;
}

message GitPushResponse {
  bool success = 1;
  string message = 2;
}

message GitCheckoutRequest {
  string project_name = 1;
  string branch_name = 2;
}

message GitCheckoutResponse {
  bool success = 1;
  string message = 2;
}

message GenerateChangelogRequest {
  string project_name = 1;
  string branch_name = 2;
}

message GenerateChangelogResponse {
  bool success = 1;
  string message = 2;
  string changelog_yaml = 3;
}

message GitBackfillRequest {
  string project_name = 1;
  string branch_name = 2;
  string start_version = 3;
  string start_commit = 4;
  string start_date = 5;
}

message GitBackfillResponse {
  bool success = 1;
  string message = 2;
  string changelog_yaml = 3;
}

message GitReleaseRequest {
  string project_name = 1;
  string source_branch = 2;
  string target_branch = 3;
  bool skip_changelog_generation = 4;
  bool debug = 5;
  bool keep_branch = 6;
  string author = 7;
  bool dry_run = 8;
}

message GitReleaseResponse {
  bool success = 1;
  string message = 2;
}

message GitRetryRequest {
  string project_name = 1;
  int32 pipeline_id = 2;
  bool debug = 3;
  int32 merge_id = 4;
  bool skip_warnings = 5;
  string author = 6;
}

message GitRetryResponse {
  bool success = 1;
  string message = 2;
}

message GitAuditRequest {
  string id = 1;
  string project_name = 2;
}

message GitAuditResponse {
  bool success = 1;
  string message = 2;
  string result_json = 3;
}

message GitInventoryRequest {
  string project_name = 1;
}

message GitInventoryResponse {
  bool success = 1;
  string message = 2;
  string result_json = 3;
}

message GetChangelogRequest {
  string project_name = 1; 
}

message GetChangelogResponse {
  bool success = 1;
  string message = 2;
  string raw_yaml_changelog = 3;
}

message GetDocumentationRequest {
  string project_name = 1;
}

message Document {
  string filename = 1;
  string raw_markdown = 2;
}

message GetDocumentationResponse {
  bool success = 1;
  string message = 2;
  repeated Document documents = 3;
}

message HaloDocument {
  string filename = 1;
  string raw_markdown = 2;
  string doc_type = 3;
  string category = 4;
  string name = 5;
  string acronym = 6;
  string version = 7;
  string author = 8;
  string status = 9;
  string date = 10;
  string relative_path = 11;
  string project_name = 12;
}

message GetHaloDocumentationTreeRequest {}

message GetHaloDocumentationTreeResponse {
  bool success = 1;
  string message = 2;
  repeated HaloDocument documents = 3;
}

message GitInventorySyncRequest {
  string project_name = 1;
}

message GitInventorySyncResponse {
  bool success = 1;
  string message = 2;
}

message GitDeleteRequest {
  string project_name = 1;
  string branch_name = 2;
  string container_tag = 3;
  string author = 4;
}

message GitDeleteResponse {
  bool success = 1;
  string message = 2;
}

message FeatureCatalogEntry {
  string id = 1;
  string feature_name = 2;
  string description = 3;
  string product_category = 4;
  string ui_grouping = 5;
  string env_variable = 6;
  string gitops_dependencies_json = 7;
  string pricing_tiers_json = 10;
  bool is_paid_addon = 8;
  bool enabled_by_default = 9;
}

message ListFeaturesRequest {}

message ListFeaturesResponse {
  bool success = 1;
  string message = 2;
  repeated FeatureCatalogEntry features = 3;
}

message UpsertFeatureRequest {
  string feature_name = 1;
  string description = 2;
  string product_category = 3;
  string ui_grouping = 4;
  string env_variable = 5;
  string gitops_dependencies_json = 6;
  string pricing_tiers_json = 9;
  bool is_paid_addon = 7;
  bool enabled_by_default = 8;
}

message UpsertFeatureResponse {
  bool success = 1;
  string message = 2;
  FeatureCatalogEntry feature = 3;
}

message NetboxAuditTenantRequest {
  string tenant_slug = 1;
  bool ip_audit = 2;
}

message NetboxAuditTenantResponse {
  bool success = 1;
  string message = 2;
  string result_json = 3;
}

message DeployTenantScaffoldRequest {
  string tenant_acronym = 1;
  string region = 2;
  string target_cluster = 3;
  map<string, string> image_selections = 4;
  map<string, string> variables = 5;
  bool is_internal = 6;
  string netbox_slug = 7;
}

message DeployTenantScaffoldResponse {
  bool success = 1;
  string message = 2;
}

message DecommissionTenantRequest {
  string tenant_acronym = 1;
  string region = 2;
}

message DecommissionTenantResponse {
  bool success = 1;
  string message = 2;
}

message GetBaseSchemaRequest {
  string component = 1;
}

message GetBaseSchemaResponse {
  bool success = 1;
  string message = 2;
  string schema_yaml = 3;
}